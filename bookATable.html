<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/x-icon" href="images/logo.png" />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <title data-i18n="meta.bookingTitle">Coffee Shop☕ | Book a Table</title>

    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/bookatable.css" />
  </head>

  <body>
    <div id="navbar"></div>

    <main class="booking-page">
      <div class="booking-container">
        <div class="left-panel">
          <h3 data-i18n="booking.openingTimes">Opening Times</h3>

          <p class="time-mon">
            <span data-i18n="booking.weekdays"> Monday — Friday </span>
            <br />
            7am — 6pm
          </p>

          <p class="time-sat">
            <span data-i18n="booking.weekend"> Saturday/Sunday </span>
            <br />
            8am — 6pm
          </p>
        </div>

        <div class="right-panel">
          <h1 data-i18n="booking.title">Book a Table</h1>

          <form id="bookingForm" action="#" method="POST" novalidate>
            <div class="form-group">
              <label class="field-label" for="name" data-i18n="booking.name">
                YOUR NAME
              </label>

              <input
                type="text"
                id="name"
                name="name"
                minlength="2"
                maxlength="50"
                required
              />
            </div>

            <div class="form-group">
              <label class="field-label" for="email" data-i18n="booking.email">
                YOUR EMAIL
              </label>

              <input
                type="email"
                id="email"
                name="email"
                maxlength="100"
                required
              />
            </div>

            <div class="form-group">
              <label class="field-label" for="date" data-i18n="booking.date">
                DATE
              </label>

              <input type="date" id="date" name="date" required />
            </div>

            <div class="form-group">
              <label
                class="field-label"
                for="people"
                data-i18n="booking.numberOfPeople"
              >
                NUMBER OF PEOPLE
              </label>

              <input
                type="number"
                id="people"
                name="people"
                min="1"
                max="10"
                required
              />
            </div>

            <div class="form-group">
              <label
                class="field-label"
                for="message"
                data-i18n="booking.message"
              >
                YOUR MESSAGE
              </label>

              <textarea
                id="message"
                name="message"
                minlength="10"
                maxlength="500"
              ></textarea>
            </div>

            <button type="submit" data-i18n="booking.send">SEND</button>
          </form>
        </div>
      </div>

      <div
        class="modal fade"
        id="bookingSuccessModal"
        tabindex="-1"
        aria-labelledby="bookingSuccessModalLabel"
        aria-hidden="true"
      >
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content booking-success-modal">
            <div class="modal-body text-center p-5">
              <div class="booking-success-icon">
                <i class="fa-solid fa-check"></i>
              </div>

              <h2
                id="bookingSuccessModalLabel"
                data-i18n="booking.successTitle"
              >
                Reservation Request Received
              </h2>

              <p data-i18n="booking.successMessage">
                Thank you for your reservation request. We will confirm your
                table within 24 hours via email.
              </p>

              <button
                type="button"
                class="booking-success-btn"
                data-bs-dismiss="modal"
                data-i18n="booking.continue"
              >
                CONTINUE
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module" src="js/main.js"></script>

    <script type="module" src="js/bookATable.js"></script>
  </body>
</html>
