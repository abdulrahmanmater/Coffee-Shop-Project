<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title data-i18n="meta.cartTitle">Coffee Shop ☕ | Cart</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <!-- Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&display=swap"
      rel="stylesheet"
    />

    <!-- Main Styles -->
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/cart.css" />
  </head>

  <body class="cart-page">
    <div id="navbar"></div>

    <main>
      <section class="cart-header">
        <div class="container">
          <h1 data-i18n="cart.title">Cart</h1>
        </div>
      </section>

      <section class="cart-content">
        <div class="container">
          <!-- Cart Items -->
          <div class="table-responsive cart-table-wrapper">
            <table class="table table-cart align-middle mb-0">
              <thead>
                <tr>
                  <th class="cart-remove-column"></th>

                  <th data-i18n="cart.product">Product</th>

                  <th data-i18n="cart.price">Price</th>

                  <th data-i18n="cart.quantity">Quantity</th>

                  <th data-i18n="cart.subtotal">Subtotal</th>
                </tr>
              </thead>

              <tbody id="cartItems"></tbody>
            </table>
          </div>

          <!-- Coupon + Update -->
          <div class="cart-actions">
            <div class="cart-coupon">
              <input
                id="couponInput"
                type="text"
                class="coupon-input"
                placeholder="Coupon code"
                data-i18n-placeholder="cart.couponCode"
              />

              <button
                id="applyCouponBtn"
                type="button"
                class="cart-action-btn"
                data-i18n="cart.applyCoupon"
              >
                Apply Coupon
              </button>
            </div>
          </div>

          <!-- Cart Totals -->
          <div class="row justify-content-end">
            <div class="col-12 col-md-7 col-lg-5 col-xl-4">
              <div class="summary-card">
                <h2 data-i18n="cart.cartTotals">Cart Totals</h2>

                <div class="summary-row">
                  <span data-i18n="cart.subtotal"> Subtotal </span>

                  <span id="cartSubtotal"> $0.00 </span>
                </div>

                <div class="summary-row" id="discountRow" style="display: none; color: green;">
                  <span> Discount </span>

                  <span id="cartDiscount"> -$0.00 </span>
                </div>

                <div class="summary-row summary-total">
                  <span data-i18n="cart.total"> Total </span>

                  <span id="cartTotal"> $0.00 </span>
                </div>

                <a
                  href="checkout.html"
                  class="checkout-btn"
                  data-i18n="cart.proceedToCheckout"
                >
                  Proceed to Checkout
                </a>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div id="footer"></div>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/cart.js"></script>
  </body>
</html>
