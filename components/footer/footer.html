<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <title>Amaya Coffee Company</title>

    <link rel="stylesheet" href="../../css/global.css" />
  </head>

  <body class="d-flex flex-column min-vh-100">
    <main class="flex-grow-1">
      <section class="container py-5"></section>
    </main>

    <footer class="footer">
      <div class="container">
        <div class="row g-4 py-5">
          <div class="col-12 col-sm-6 col-lg-4">
            <h4 class="footer-heading">About</h4>

            <ul class="footer-links">
              <li>
                <a href="#"> Company </a>
              </li>

              <li>
                <a href="FAQ.html"> FAQ </a>
              </li>
            </ul>
          </div>

          <div class="col-12 col-sm-6 col-lg-4 text-lg-center">
            <h4 class="footer-heading">Locations</h4>

            <ul class="footer-links">
              <li>
                <a href="#"> San Francisco </a>
              </li>

              <li>
                <a href="#"> Laguna Beach </a>
              </li>
            </ul>
          </div>

          <div class="col-12 col-lg-4">
            <h4 class="footer-heading">Follow Along</h4>

            <div class="footer-socials justify-content-lg-end">
              <a href="#" aria-label="Instagram">
                <i class="fa-brands fa-instagram"></i>
              </a>

              <a href="#" aria-label="Facebook">
                <i class="fa-brands fa-facebook-f"></i>
              </a>

              <a href="#" aria-label="X">
                <i class="fa-brands fa-x-twitter"></i>
              </a>

              <a href="#" aria-label="TikTok">
                <i class="fa-brands fa-tiktok"></i>
              </a>
            </div>
          </div>
        </div>
      </div>

      <div class="footer-bottom">
        <div class="container">
          <div class="row align-items-center justify-content-between g-3 py-4">
            <div class="col-12 col-md-4 text-center text-md-start">
              <span class="footer-copy">
                &copy; 2020 Amaya. All Rights Reserved.
              </span>
            </div>

            <div class="col-12 col-md-4 text-center">
              <a
                href="#"
                class="footer-logo"
                aria-label="Amaya Coffee Company Home"
              >
                <img
                  src="../../images/Amaya logo-C4B59E.png"
                  alt="Amaya Coffee Company"
                />
              </a>
            </div>

            <div class="col-12 col-md-4 text-center text-md-end">
              <span class="footer-tagline"> Because We Love Coffee </span>
            </div>
          </div>
        </div>
      </div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwxHj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
