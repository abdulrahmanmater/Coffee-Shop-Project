<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- Font Awesome -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      rel="stylesheet"
    />

    <title>Amaya Coffee Company</title>

    <link rel="stylesheet" href="../../css/global.css" />
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
      <div class="container-fluid px-4 px-xl-5">
        <!-- Mobile Logo -->
        <a
          class="navbar-brand navbar-logo d-lg-none"
          href="#"
          aria-label="Amaya Coffee Company Home"
        >
          <img
            src="../../images/Amaya logo-C4B59E.png"
            alt="Amaya Coffee Company"
          />
        </a>

        <!-- Mobile Toggle -->
        <button
          class="navbar-toggler ms-auto"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarMenu"
          aria-controls="navbarMenu"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <i class="fa-solid fa-bars"></i>
        </button>

        <!-- Navigation -->
        <div class="collapse navbar-collapse" id="navbarMenu">
          <!-- Left Navigation -->
          <ul class="navbar-nav navbar-nav-left">
            <li class="nav-item">
              <a class="nav-link active" href="#"> Home </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#"> About </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#"> Journal </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#"> FAQ </a>
            </li>
          </ul>

          <!-- Center Logo -->
          <a
            class="navbar-brand navbar-logo navbar-logo-center d-none d-lg-block"
            href="#"
            aria-label="Amaya Coffee Company Home"
          >
            <img
              src="../../images/Amaya logo-C4B59E.png"
              alt="Amaya Coffee Company"
            />
          </a>

          <!-- Right Navigation -->
          <ul class="navbar-nav navbar-nav-right">
            <li class="nav-item">
              <a class="nav-link" href="#"> Shop </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#"> Contact </a>
            </li>

            <li class="nav-item">
              <a
                class="nav-link nav-utility-link"
                href="#"
                aria-label="Account"
              >
                <i class="fa-regular fa-user"></i>
                <span>Account</span>
              </a>
            </li>

            <li class="nav-item">
              <a
                class="nav-link nav-utility-link"
                href="#"
                aria-label="Shopping Cart"
              >
                <i class="fa-solid fa-bag-shopping"></i>
                <span>Cart</span>
              </a>
            </li>

            <li class="nav-item">
              <a href="#" class="nav-book-table"> Book a Table </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
