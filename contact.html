<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Discover our coffee shop locations, addresses, and opening information."
    />

    <link rel="icon" type="image/x-icon" href="images/logo.png" />

    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:wght@600&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/global.css" />

    <link rel="stylesheet" href="css/contact.css" />

    <title data-i18n="meta.locationsTitle">Coffee Shop ☕ | Locations</title>
  </head>

  <body class="locations-page">
    <div id="navbar"></div>

    <main>
      <section class="location-row">
        <div class="location-image">
          <img
            src="https://www.amayatheme.redsun.design/dark/wp-content/uploads/sites/5/2021/10/amaya-114-1024x1024.jpg"
            alt="San Francisco Amaya coffee shop"
            data-i18n-alt="contact.sanFrancisco.imageAlt"
          />
        </div>

        <div class="location-info">
          <div class="location-inner">
            <p class="location-name">SAN FRANCISCO</p>

            <h1>Pier 39</h1>

            <address data-i18n="contact.sanFrancisco.address">
              PIER 39, P.O. Box 19730 San Francisco, CA 94122
            </address>

            <a class="phone" href="tel:123456789"> (123) 456-789 </a>

            <a
              class="details-button"
              href="bookATable.html"
              data-i18n="common.bookTable"
            >
              Book a Table
            </a>
          </div>
        </div>
      </section>

      <section class="location-row reverse">
        <div class="location-info">
          <div class="location-inner">
            <p class="location-name">LAGUNA BEACH</p>

            <h2>Lido Marina Village</h2>

            <address data-i18n="contact.lagunaBeach.address">
              3434 Via Lido Laguna Beach, CA 92663
            </address>

            <a class="phone" href="tel:123456789"> (123) 456-789 </a>

            <a
              class="details-button"
              href="bookATable.html"
              data-i18n="common.bookTable"
            >
              Book a Table
            </a>
          </div>
        </div>

        <div class="location-image">
          <img
            src="https://www.amayatheme.redsun.design/dark/wp-content/uploads/sites/5/2021/10/amaya-85-1024x1024.jpg"
            alt="Laguna Beach Amaya coffee shop"
            data-i18n-alt="contact.lagunaBeach.imageAlt"
          />
        </div>
      </section>
    </main>

    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
