<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <title>Amaya Coffee Company</title>
  </head>

  <style>
    .footer {
      background-color: #0a0b0a;
      border-top: 1px solid #2a2a2a;
      padding: 3rem 4rem 0;
      font-family: inherit;
    }

    .footer-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding-bottom: 2.5rem;
    }

    .footer-col {
      flex: 1;
    }

    .footer-col--center {
      text-align: center;
    }

    .footer-col--right {
      text-align: right;
    }

    .footer-heading {
      color: #c4b59e;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      margin-bottom: 1.2rem;
      text-transform: uppercase;
    }

    .footer-links {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .footer-links li {
      margin-bottom: 0.6rem;
    }

    .footer-links li a {
      color: #888;
      text-decoration: none;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    .footer-links li a:hover {
      color: #c4b59e;
    }

    .footer-socials {
      display: flex;
      justify-content: flex-end;
      gap: 1.2rem;
      margin-top: 0.2rem;
    }

    .footer-socials a {
      color: #c4b59e;
      text-decoration: none;
      transition: opacity 0.2s;
      display: flex;
      align-items: center;
      font-size: 1.2rem;
    }

    .footer-socials a:hover {
      opacity: 0.7;
    }

    .footer-bottom {
      border-top: 1px solid #2a2a2a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 0;
    }

    .footer-copy,
    .footer-tagline {
      color: #555;
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .footer-logo img {
      height: 48px;
      width: auto;
      object-fit: contain;
    }
  </style>

  <body>
    <footer class="footer">
      <div class="footer-top">
        <div class="footer-col">
          <h4 class="footer-heading">ABOUT</h4>
          <ul class="footer-links">
            <li><a href="#">COMPANY</a></li>
            <li><a href="FAQ.html">FAQ</a></li>
          </ul>
        </div>

        <div class="footer-col footer-col--center">
          <h4 class="footer-heading">LOCATIONS</h4>
          <ul class="footer-links">
            <li><a href="#">SAN FRANCISCO</a></li>
            <li><a href="#">LAGUNA BEACH</a></li>
          </ul>
        </div>

        <div class="footer-col footer-col--right">
          <h4 class="footer-heading">FOLLOW ALONG</h4>
          <div class="footer-socials">
            <a href="#" aria-label="Instagram"
              ><i class="fa-brands fa-instagram"></i
            ></a>
            <a href="#" aria-label="Facebook"
              ><i class="fa-brands fa-facebook-f"></i
            ></a>
            <a href="#" aria-label="X"
              ><i class="fa-brands fa-x-twitter"></i
            ></a>
            <a href="#" aria-label="TikTok"
              ><i class="fa-brands fa-tiktok"></i
            ></a>
          </div>
        </div>
      </div>

      <div class="footer-bottom">
        <span class="footer-copy">&copy; 2020 AMAYA. ALL RIGHTS RESERVED.</span>
        <div class="footer-logo">
          <img
            src="assets/images/Amaya logo-C4B59E.png"
            alt="Amaya Coffee Company"
          />
        </div>
        <span class="footer-tagline">BECAUSE WE LOVE COFFEE</span>
      </div>
    </footer>

    <script src="assets/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
