<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Explore brewing methods, coffee culture, recipes, sustainability, and stories from the world of specialty coffee."
    />

    <link rel="icon" type="image/x-icon" href="images/logo.png" />

    <title data-i18n="meta.journalTitle">Coffee Lovers Journal</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/global.css" />

    <link rel="stylesheet" href="css/journal.css" />
  </head>

  <body class="journal-page">
    <div id="navbar"></div>

    <header class="journal-header">
      <h1 data-i18n="journal.title">Coffee Lovers Journal</h1>

      <p data-i18n="journal.description">
        Explore brewing methods, flavor secrets, and the latest news from the
        world of specialty coffee
      </p>
    </header>

    <main class="journal-layout">
      <section class="journal-filter">
        <div class="categories-filter" id="categoryContainer"></div>

        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>

          <input
            type="search"
            id="searchInput"
            data-i18n-placeholder="journal.searchPlaceholder"
            placeholder="Search articles..."
          />
        </div>
      </section>

      <section class="articles-grid" id="articlesGrid"></section>

      <aside class="sidebar">
        <div class="sidebar-widget">
          <h3 class="widget-title" data-i18n="journal.mostRead">
            Most Read This Week
          </h3>

          <ul class="trending-list" id="trendingList"></ul>
        </div>

        <div class="sidebar-widget newsletter-widget">
          <h3 class="widget-title" data-i18n="journal.newsletterTitle">
            Newsletter
          </h3>

          <p data-i18n="journal.newsletterDescription">
            Subscribe to get exclusive coffee recipes and store discounts
            directly in your inbox.
          </p>

          <form class="newsletter-form" id="newsletterForm">
            <input
              type="email"
              name="email"
              required
              data-i18n-placeholder="journal.newsletterEmailPlaceholder"
              placeholder="Enter your email"
            />

            <button type="submit" data-i18n="journal.subscribeNow">
              Subscribe Now
            </button>
          </form>
        </div>
      </aside>
    </main>

    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module" src="js/main.js"></script>

    <script type="module" src="js/journal.js"></script>
  </body>
</html>
