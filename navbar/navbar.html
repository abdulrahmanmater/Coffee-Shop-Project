<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      rel="stylesheet"
    />
    <title>navbar</title>
    <style>
      .navbar {
        background-color: #1a1510;
        min-height: 70px;
      }

      .navbar .nav-link {
        color: #c4b59e;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        white-space: nowrap;
        transition: color 0.2s;
      }

      .navbar .nav-link:hover {
        color: #e8d9c4;
      }

      .navbar-logo img {
        height: 50px;
        width: auto;
        object-fit: contain;
      }

      .navbar-toggler {
        border-color: #c4b59e;
      }

      .navbar-collapse {
        background-color: #1a1510;
      }
    </style>
  </head>

  <body>
    <nav class="navbar navbar-expand-lg px-4  fixed-top">
      <a class="navbar-brand navbar-logo d-lg-none" href="#">
        <img src="Amaya logo-C4B59E.png" alt="Amaya Coffee Company" />
      </a>

      <button
        class="navbar-toggler ms-auto"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarMenu"
        aria-controls="navbarMenu"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <i
          class="fa-solid fa-bars"
          style="color: #c4b59e; font-size: 1.2rem"
        ></i>
      </button>

      <div class="collapse navbar-collapse" id="navbarMenu">
        <ul class="navbar-nav gap-4 me-auto">
          <li class="nav-item"><a class="nav-link" href="#">HOME</a></li>
          <li class="nav-item"><a class="nav-link" href="#">ABOUT</a></li>
          <li class="nav-item"><a class="nav-link" href="#">JOURNAL</a></li>
          <li class="nav-item"><a class="nav-link" href="#">FAQ</a></li>
        </ul>

        <a
          class="navbar-brand navbar-logo position-absolute start-50 translate-middle-x d-none d-lg-flex"
          href="#"
        >
          <img src="Amaya logo-C4B59E.png" alt="Amaya Coffee Company" />
        </a>

        <ul class="navbar-nav gap-4 ms-auto">
          <li class="nav-item"><a class="nav-link" href="#">SHOP</a></li>
          <li class="nav-item"><a class="nav-link" href="#">ACCOUNT</a></li>
          <li class="nav-item"><a class="nav-link" href="#">CART</a></li>
          <li class="nav-item"><a class="nav-link" href="#">CONTACT</a></li>
        </ul>
      </div>
    </nav>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
