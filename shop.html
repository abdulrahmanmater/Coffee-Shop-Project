<!-- shop.html -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/x-icon" href="images/logo.png" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />

    <link rel="stylesheet" href="css/global.css" />

    <link rel="stylesheet" href="css/shop.css" />

    <title>Coffee Shop ☕ | Shop</title>
  </head>

  <body>
    <div id="navbar"></div>

    <main>
      <section class="site-content py-5">
        <div class="container">
          <header class="mb-5">
            <h1 class="page-title mb-2">Shop</h1>

            <p class="shop-description mb-0">
              Explore our coffee, cold brew, decaf, and merchandise.
            </p>
          </header>

          <div class="row g-4">
            <!-- Filters -->

            <aside class="col-12 col-lg-3">
              <form id="filter-form" class="shop-filter-card">
                <div
                  class="d-flex justify-content-between align-items-center mb-4"
                >
                  <h2 class="h5 mb-0">Filters</h2>

                  <button
                    type="button"
                    id="reset-filters"
                    class="reset-filters"
                  >
                    Reset
                  </button>
                </div>

                <!-- Categories -->

                <div class="mb-4">
                  <h3 class="h6 mb-3">Categories</h3>

                  <div
                    id="categories-filter"
                    class="d-flex flex-column gap-2"
                  ></div>
                </div>

                <!-- Price -->

                <div class="mb-4">
                  <h3 class="h6 mb-3">Price Range</h3>

                  <div class="row g-2">
                    <div class="col-6">
                      <label for="min-price" class="form-label small">
                        Min
                      </label>

                      <input
                        type="number"
                        id="min-price"
                        class="form-control price-input"
                        min="0"
                        step="0.01"
                        placeholder="Min price"
                      />
                    </div>

                    <div class="col-6">
                      <label for="max-price" class="form-label small">
                        Max
                      </label>

                      <input
                        type="number"
                        id="max-price"
                        class="form-control price-input"
                        min="0"
                        step="0.01"
                        placeholder="Max price"
                      />
                    </div>
                  </div>
                </div>

                <p
                  id="filter-error"
                  class="filter-error d-none"
                  role="alert"
                ></p>

                <button type="submit" class="filter-submit">
                  Apply Filters
                </button>
              </form>
            </aside>

            <!-- Products -->

            <section class="col-12 col-lg-9">
              <!-- Shop Toolbar -->

              <div
                class="shop-toolbar d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4"
              >
                <p
                  id="results-count"
                  class="results-count"
                  aria-live="polite"
                ></p>

                <div class="d-flex flex-wrap align-items-center gap-3">
                  <div class="d-flex align-items-center gap-2">
                    <label for="sort-select" class="sort-label text-nowrap">
                      Sort By:
                    </label>

                    <select id="sort-select" class="form-select sort-select">
                      <option value="price">Price</option>

                      <option value="latest" selected>Latest</option>

                      <option value="rating">Rating</option>
                    </select>
                  </div>

                  <div class="d-flex align-items-center gap-2">
                    <label for="order-select" class="sort-label text-nowrap">
                      Order:
                    </label>

                    <select id="order-select" class="form-select sort-select">
                      <option value="asc">Ascending</option>

                      <option value="desc" selected>Descending</option>
                    </select>
                  </div>
                </div>
              </div>

              <!-- Products Grid -->

              <div class="products-section row g-4"></div>

              <!-- Pagination -->

              <nav class="mt-5" aria-label="Product pagination">
                <ul
                  id="pagination"
                  class="pagination justify-content-center flex-wrap gap-1"
                ></ul>
              </nav>
            </section>
          </div>
        </div>
      </section>
    </main>

    <footer id="footer"></footer>

    <script type="module" src="./js/main.js"></script>
    <script type="module" src="./js/shop.js"></script>
  </body>
</html>
